    <text class="t2" x="824" y="540">consulta_catalogo · validar_cobertura</text>
    <text class="t2" x="824" y="562">validar_disponibilidad (72h/feriados)</text>
    <text class="t2" x="824" y="584">calcular_cotizacion (zona&#215;temporada + S/50)</text>
    <text class="t2" x="824" y="606">motor_comparacion (pesos del negocio)</text>
    <text class="t2" x="824" y="628">preferencias (con consentimiento)</text>
    <text class="t2" x="824" y="650" font-weight="bold">registrar_cotizacion (insert · NO bloquea)</text>
    <text class="t2" x="824" y="672">derivar_a_asesor</text>
    <text class="t2" x="824" y="702" font-style="italic" fill="#8a6d1f">precio y calendario JAMÁS salen del LLM</text>
  </g>

