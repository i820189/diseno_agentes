  <path d="M1080 700 H1620 V646 H1660" stroke="#5a9e4b" stroke-width="2.2" fill="none" stroke-dasharray="8 5" marker-end="url(#arrG)"/>
  <text class="lbl" x="1350" y="692" text-anchor="middle">derivación / cierre (WhatsApp)</text>

