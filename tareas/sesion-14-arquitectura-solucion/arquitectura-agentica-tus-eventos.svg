    <text class="t2" x="316" y="394">Business</text>
    <text class="t2" x="316" y="412">Cloud API (Meta)</text>
  </g>

  <!-- ============ FLECHAS ============ -->
  <!-- cliente -> wa -->
  <path class="flow" d="M210 387 H250"/>
  <!-- wa -> bff -->
  <path class="flow" d="M410 387 H455 V340 H500"/>
  <text class="lbl" x="418" y="378">webhook</text>
  <!-- streamlit -> bff (dashed) -->
  <path class="dash" d="M330 212 H478 V318 H500"/>
  <text class="lbl" x="352" y="204">demo</text>
  <!-- bff -> agente -->
  <path class="flow" d="M730 340 H820"/>
  <text class="lbl" x="775" y="330" text-anchor="middle">invoke (thread_id)</text>
  <!-- bff -> guardrails (dashed rojo) -->
  <path d="M615 390 V442" stroke="#b85450" stroke-width="2" fill="none" stroke-dasharray="6 4" marker-end="url(#arrR)"/>
  <text class="lbl" x="624" y="420">valida E/S</text>
  <!-- agente -> checkpointer (dashed) -->
  <path class="dash" d="M835 400 V462 H775 V560 H700 V584" stroke="#6c8ebf"/>
  <!-- checkpointer -> postgres (persiste) -->
  <path class="dash" d="M625 676 V840" stroke="#6c8ebf"/>
  <text class="lbl" x="634" y="762">persiste estado</text>
  <!-- ReAct loop -->
  <path class="flow" d="M885 400 V480"/>
  <path class="flow" d="M1010 480 V400"/>
  <text class="lbl" x="874" y="444" text-anchor="end">action</text>
  <text class="lbl" x="1021" y="444">observation</text>
  <text x="947" y="446" text-anchor="middle" font-size="12.5" font-weight="bold" font-style="italic" fill="#9673a6">ReAct</text>
  <text x="947" y="462" text-anchor="middle" font-size="12.5" font-weight="bold" font-style="italic" fill="#9673a6">loop</text>
