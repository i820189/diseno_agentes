  <g transform="translate(1050,240) scale(1.25)">
    <path d="M12 2c-4 0-5 1.7-5 3.5V8h5v1H5.5C3.5 9 2 10.6 2 13s1.5 4 3.5 4H7v-2.5C7 12.6 8.8 11 11 11h5c1.7 0 3-1.3 3-3V5.5C19 3.7 16 2 12 2zm-2 2.2c.6 0 1 .4 1 1s-.4 1-1 1-1-.4-1-1 .4-1 1-1z" fill="#3776AB"/>
    <path d="M12 22c4 0 5-1.7 5-3.5V16h-5v-1h6.5c2 0 3.5-1.6 3.5-4s-1.5-4-3.5-4H17v2.5c0 1.9-1.8 3.5-4 3.5H8c-1.7 0-3 1.3-3 3v2.5C5 20.3 8 22 12 22zm2-2.2c-.6 0-1-.4-1-1s.4-1 1-1 1 .4 1 1-.4 1-1 1z" fill="#FFD43B"/>
  </g>

  <!-- BFF -->
