    </g>
    <text class="t1" x="882" y="318">AGENTE — create_agent</text>
    <text class="t2" x="882" y="340">LangChain · Goal-Based · ReAct</text>
    <text class="t2" x="882" y="360">system prompt (versionado)</text>
    <text class="t2" x="882" y="380" font-style="italic">el LLM decide el orden en runtime</text>
  </g>

  <!-- TOOLS -->
  <g>
    <rect class="card" x="800" y="480" width="280" height="254" rx="12" stroke="#d6b656" stroke-width="1.6"/>
    <rect x="800" y="480" width="6" height="254" rx="3" fill="#d6b656"/>
    <g transform="translate(818,496) scale(1.05)">
      <path d="M22.7 19l-9.1-9.1c.9-2.3.4-5-1.5-6.9-2-2-5-2.4-7.4-1.3L9 6 6 9 1.6 4.7C.4 7.1.9 10.1 2.9 12.1c1.9 1.9 4.6 2.4 6.9 1.5l9.1 9.1c.4.4 1 .4 1.4 0l2.3-2.3c.5-.4.5-1.1.1-1.4z" fill="#b08d2f"/>
