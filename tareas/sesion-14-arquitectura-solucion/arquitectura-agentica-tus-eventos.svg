    <text class="t2" x="562" y="636">PostgresSaver · memoria corto</text>
    <text class="t2" x="562" y="654">plazo por thread_id</text>
  </g>

  <!-- AGENTE -->
  <g>
    <rect class="card" x="820" y="290" width="250" height="110" rx="12" stroke="#9673a6" stroke-width="1.8"/>
    <rect x="820" y="290" width="6" height="110" rx="3" fill="#9673a6"/>
