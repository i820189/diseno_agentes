    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#555"/>
    </marker>
    <marker id="arrG" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#5a9e4b"/>
    </marker>
    <marker id="arrP" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#9673a6"/>
    </marker>
    <marker id="arrR" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#b85450"/>
    </marker>
    <style>
      .card{fill:#ffffff;filter:url(#sh);}
      .t1{font-size:15px;font-weight:bold;fill:#222;}
      .t2{font-size:12.5px;fill:#444;}
      .lbl{font-size:11.5px;fill:#333;paint-order:stroke;stroke:#ffffff;stroke-width:5px;font-style:italic;}
      .flow{stroke:#555;stroke-width:2.2;fill:none;marker-end:url(#arr);}
      .dash{stroke:#888;stroke-width:2;fill:none;stroke-dasharray:7 5;marker-end:url(#arr);}
    </style>
  </defs>

  <!-- ============ TITULO ============ -->
  <text x="990" y="46" text-anchor="middle" font-size="28" font-weight="bold" fill="#1a1a1a">ARQUITECTURA AGÉNTICA — TUS EVENTOS</text>
  <text x="990" y="72" text-anchor="middle" font-size="14.5" fill="#555">Agente de recomendaciones y atención para ocasiones de consumo · monoagente híbrido con flujo controlado</text>
  <text x="990" y="94" text-anchor="middle" font-size="12.5" font-style="italic" fill="#777">Basado en el Agentic Profile Card v3.2 · 100% dockerizado · se levanta en local</text>

  <!-- ============ MARCO DOCKER ============ -->
  <rect x="430" y="150" width="1180" height="880" rx="24" fill="#f7f8fa" stroke="#9aa0a8" stroke-width="1.8" stroke-dasharray="10 6"/>
  <!-- icono docker -->
  <g transform="translate(455,163)">
    <rect x="2" y="12" width="9" height="8" rx="1" fill="#2496ED"/>
    <rect x="12" y="12" width="9" height="8" rx="1" fill="#2496ED"/>
    <rect x="22" y="12" width="9" height="8" rx="1" fill="#2496ED"/>
    <rect x="12" y="2" width="9" height="8" rx="1" fill="#2496ED"/>
    <path d="M0 22 h33 c9 0 14-4 15.5-9 3.5 .5 6-1 7-2 -1.5-1.5-4.5-2-6.5-1 -1-2.5-3-3.5-3-3.5s-1.5 2-1 4.5H0z" fill="#2496ED" transform="translate(0,4)"/>
  </g>
  <text x="520" y="190" font-size="19" font-weight="bold" fill="#1a1a1a">PLATAFORMA TUS EVENTOS — Docker Compose (levantar en LOCAL)</text>
  <text x="520" y="211" font-size="13" font-style="italic" fill="#666">1 agente · tools deterministas · lo externo queda fuera del marco</text>

  <!-- ============ SUB-MARCO CONTENEDOR PYTHON ============ -->
  <rect x="470" y="232" width="630" height="568" rx="16" fill="#f0f4fa" stroke="#6c8ebf" stroke-width="1.6" stroke-dasharray="5 4"/>
  <text x="492" y="260" font-size="13" font-style="italic" fill="#4a6ea5">contenedor <tspan font-weight="bold">bff-agente</tspan> — código Python (.py)</text>
