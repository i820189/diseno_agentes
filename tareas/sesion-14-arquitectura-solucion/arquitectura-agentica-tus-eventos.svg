    <text class="t2" x="580" y="892">catálogo · precios (zona&#215;temporada) · calendario/disponibilidad</text>
    <text class="t2" x="580" y="916" font-weight="bold" fill="#2c5a7c">cotización &#8594; reserva PENDIENTE &#8594; pago &#8594; reserva CONFIRMADA (bloquea · la convierte el asesor)</text>
    <text class="t2" x="580" y="940">expedientes + preferencias (con consentimiento) · checkpointer</text>
    <text class="t2" x="580" y="964" font-style="italic" fill="#666">transacciones ACID = control de doble-booking · una sola fuente de verdad</text>
  </g>

