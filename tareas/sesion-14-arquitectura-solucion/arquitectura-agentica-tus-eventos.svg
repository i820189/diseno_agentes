  </g>

  <!-- ============ SUSTENTO ============ -->
  <text x="990" y="1094" text-anchor="middle" font-size="14" font-style="italic" fill="#333"><tspan font-weight="bold">Sustento:</tspan> agente ÚNICO (no workflow: el orden lo decide el LLM en runtime · no multiagente: un rol, un dominio, ~20 conv/sem). Los pasos conocidos</text>
  <text x="990" y="1116" text-anchor="middle" font-size="14" font-style="italic" fill="#333">viven como gates deterministas (guardrails + tools). El agente solo INSERTA cotizaciones; pendiente y confirmada las gestiona el ASESOR en la misma BD.</text>
