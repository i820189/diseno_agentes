    <text class="t2" x="562" y="354">rate limit · API externa</text>
    <text class="t2" x="562" y="372" font-style="italic">(si se necesita)</text>
  </g>

  <!-- GUARDRAILS -->
  <g>
    <rect class="card" x="500" y="442" width="230" height="88" rx="12" stroke="#b85450" stroke-width="1.6"/>
    <rect x="500" y="442" width="6" height="88" rx="3" fill="#b85450"/>
