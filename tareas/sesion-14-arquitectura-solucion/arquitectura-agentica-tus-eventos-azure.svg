        <line x1="13" y1="2.5" x2="13" y2="6"/><line x1="13" y1="20" x2="13" y2="23.5"/>
        <line x1="2.5" y1="13" x2="6" y2="13"/><line x1="20" y1="13" x2="23.5" y2="13"/>
        <line x1="5.5" y1="5.5" x2="8" y2="8"/><line x1="18" y1="18" x2="20.5" y2="20.5"/>
        <line x1="20.5" y1="5.5" x2="18" y2="8"/><line x1="8" y1="18" x2="5.5" y2="20.5"/>
