  <!-- ============ SUSTENTO ============ -->
  <text x="990" y="1094" text-anchor="middle" font-size="14" font-style="italic" fill="#333"><tspan font-weight="bold">Sustento:</tspan> misma app (LangChain agnóstico &#8594; sin lock-in; Boris S14: "te casas con esa nube"). Container Apps con scale-to-zero &#8776; costo ~0 en reposo; AKS recién si el volumen lo exige.</text>
  <text x="990" y="1116" text-anchor="middle" font-size="14" font-style="italic" fill="#333">APIM aparece AQUÍ y no en local: capa de exposición administrada (claves, WAF, cuotas). El ciclo cotización &#8594; pendiente &#8594; CONFIRMADA no cambia: la BD sigue siendo la fuente de verdad.</text>
