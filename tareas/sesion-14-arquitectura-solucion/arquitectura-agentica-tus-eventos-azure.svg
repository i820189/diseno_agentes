  <!-- ============ TITULO ============ -->
  <text x="990" y="46" text-anchor="middle" font-size="28" font-weight="bold" fill="#1a1a1a">ARQUITECTURA AGÉNTICA — TUS EVENTOS · VERSIÓN AZURE</text>
  <text x="990" y="72" text-anchor="middle" font-size="14.5" fill="#555">Evolución cloud de la versión local: la MISMA imagen Docker, ahora en servicios administrados</text>
  <text x="990" y="94" text-anchor="middle" font-size="12.5" font-style="italic" fill="#777">Se activa cuando el volumen lo justifique — hoy (~20 conv/semana) basta la versión local</text>

  <!-- ============ MARCO AZURE ============ -->
  <rect x="430" y="150" width="1180" height="880" rx="24" fill="#eef6fd" stroke="#0078D4" stroke-width="1.8" stroke-dasharray="10 6"/>
  <!-- logo azure -->
  <g transform="translate(458,164) scale(1.5)">
    <path d="M11.5 2 L4 18.5 H8.6 L15.5 4.5 z" fill="#1489d3"/>
