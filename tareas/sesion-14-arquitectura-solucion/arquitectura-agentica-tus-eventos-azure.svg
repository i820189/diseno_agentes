  </g>
  <text x="520" y="190" font-size="19" font-weight="bold" fill="#1a1a1a">SUSCRIPCIÓN AZURE — rg-tus-eventos (IaC: Bicep/Terraform)</text>
  <text x="520" y="211" font-size="13" font-style="italic" fill="#666">región única · private endpoints</text>

